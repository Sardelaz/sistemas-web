<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Loja</title>
    <link rel="stylesheet" href="style.css">

<body>

    <h1>Painel Loja</h1>

    <nav>
        <button onclick="mostrarTela('login')">Login</button>
        <button onclick="mostrarTela('produtos')">Produtos</button>
        <button onclick="mostrarTela('admin')">Admin</button>
        <button onclick="mostrarTela('perfil')">Perfil</button>
    </nav>

    <section id="tela-login">
        <h2>Tela de Login</h2>
        <form id="form-login">
            <input type="email" id="email" placeholder="E-mail:">
            <input type="password" id="senha" placeholder="Senha:">
            <button type="submit">Enviar</button>
        </form>
        <p id="mensagem-login"></p>
    </section>

    <section id="tela-produtos" style="display: none;">
        <h2>Tela Produtos</h2>


    </section>

    <section id="tela-admin" style="display: none;">
        <h2>Área Admin</h2>
        <form id="form-produto">
            <input type="text" id="nome-produto" placeholder="Nome do produto">
            <input type="number" id="preco-produto" placeholder="Preço" step="0.01">
            <button type="submit">Cadastrar</button>
        </form>
        <p id="mensagem-produto"></p>
    </section>

    <section id="tela-perfil" style="display: none;">
        <h2>Perfil </h2>
        <p>Só eu posso acessar meu perfil.</p>
    </section>

    <script>
        function mostrarTela(nome) {

            const telas = document.querySelectorAll('section');

            telas.forEach(tela => {
                tela.style.display = 'none';
            });

            const telaEscolhida = document.getElementById('tela-' + nome);

            telaEscolhida.style.display = 'block';
        }

        const form_login = document.getElementById('form-login');

        form_login.addEventListener('submit', function (evento) {
            evento.preventDefault();

            console.log('formulario enviado, mas a página não recarregou!');

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            const token = localStorage.getItem('token')

            fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email,
                    senha: senha
                })
            })
                .then(resposta => resposta.json())
                .then(dados => {
                    if (dados.token) {
                        localStorage.setItem('token', dados.token)
                        document.getElementById('mensagem-login').textContent = 'Login feito com sucesso!'
                    } else {
                        document.getElementById('mensagem-login').textContent = 'E-mail ou senha inválidos.'
                    }
                })
                .catch(erro => {
                    console.error('Erro ao fazer login:', erro);
                });
        });
        const formProduto = document.getElementById('form-produto')
        formProduto.addEventListener('submit', function (evento) {
            evento.preventDefault()
            const nome = document.getElementById('nome-produto').value
            const preco = document.getElementById('preco-produto').value

            if (nome === '' || preco === '') {
                document.getElementById('mensagem-produto').textContent = 'Preencha nome e preço'
                return
            }
            if (Number(preco) <= 0) {
                document.getElementById('mensagem-produto').textContent = '0 O preço precisa ser maior que zero'
                return
            }
            const token = localStorage.getItem('token')
            fetch('http://localhost:3000/produtos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    nome: nome,
                    preco: Number(preco)
                })
            })
                .then(resposta => resposta.json())
                .then(dados => {
                    if (dados.erro) {
                        document.getElementById('mensagem-produto').textContent = dados.erro
                    } else {
                        document.getElementById('mensagem-produto').textContent = 'Produto cadastrado!'
                        buscarProdutos()
                    }
                })
        });

        let produtos = []

        function buscarProdutos() {
            fetch('http://localhost:3000/produtos')
                .then(resposta => resposta.json())
                .then(dados => {
                    produtos = dados
                    renderProdutos()
                })
        }
        buscarProdutos()

        function cardProdutos(produto) {
            return `
    <div class ="card-produto" data-nome="${produto.nome}">
        <h3>${produto.nome}</h3>
        <p>R$ ${produto.preco.toFixed(2)}</p>
        <button class="btn-excluir" data-nome="${produto.nome}">Excluir</button>
    </div>
    `;
        }

        const container = document.getElementById('tela-produtos')

        container.addEventListener('click', function (evento) {
            const botaoExcluir = evento.target.closest('.btn-excluir')

            if(botaoExcluir) {
                const nome = botaoExcluir.dataset.nome
                const token = localStorage.getItem('token')

                fetch('http://localhost:3000/produtos/' + nome, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                })
                .then(resposta => {
                    return resposta.json();
                })
                .then(dados => {
                    buscarProdutos()
                })
                .catch(erro => console.error('Erro:', erro));
            }

            const card = evento.target.closest('.card-produto')
            if (!card) return

            document.querySelectorAll('.card-produto').forEach(c => c.classList.remove('selecionado'))
            card.classList.add('selecionado')
        });

        function renderProdutos() {
            const container = document.getElementById('tela-produtos');
            const cards = produtos.map(cardProdutos).join('');
            container.innerHTML = `<h2>Tela de Produtos</h2>` + cards;
        }

        function adicionarProduto(nome, preco) {
            produtos.push({ nome: nome, preco: preco })
            renderProdutos()
        }
    </script>

</body>

</html>
